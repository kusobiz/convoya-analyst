# /etc/nginx/sites-available/analyst.convoya.ai
# Symlink: ln -s /etc/nginx/sites-available/analyst.convoya.ai /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name analyst.convoya.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name analyst.convoya.ai;

    ssl_certificate     /etc/letsencrypt/live/analyst.convoya.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analyst.convoya.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Upload limit for future Excel upload feature
    client_max_body_size 20M;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Longer timeout for PPT report generation (Claude Sonnet calls)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
