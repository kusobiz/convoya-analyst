<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nirvana CR — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1A2C5B;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: #C9A84C;
      border-radius: 50%;
      margin-bottom: 0.75rem;
    }
    .brand-logo svg { width: 36px; height: 36px; fill: #1A2C5B; }
    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .brand p {
      font-size: 0.8rem;
      color: #C9A84C;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .card h2 {
      font-size: 1.1rem;
      color: #1A2C5B;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .card .subtitle {
      font-size: 0.82rem;
      color: #666;
      margin-bottom: 1.75rem;
    }

    .error-box {
      background: #FEF0F0;
      border: 1px solid #E24B4A;
      color: #E24B4A;
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      font-size: 0.84rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .error-box.show { display: block; }

    .info-box {
      background: #EEF2FA;
      border: 1px solid #1A2C5B;
      color: #1A2C5B;
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      font-size: 0.84rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .info-box.show { display: block; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #1A2C5B;
      margin-bottom: 0.4rem;
    }

input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #D0D5E0;
      border-radius: 7px;
      font-size: 0.95rem;
      color: #1A1A2E;
      outline: none;
      transition: border-color 0.2s;
      background: #F5F6F8;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #1A2C5B;
      background: #fff;
    }
    .field { margin-bottom: 1.1rem; }

    button[type="submit"] {
      margin-top: 0.25rem;
      width: 100%;
      padding: 0.75rem;
      background: #1A2C5B;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover { background: #243d7a; }
    button[type="submit"]:active { transform: scale(0.98); }

    .gold-rule {
      height: 3px;
      background: linear-gradient(90deg, #C9A84C, #e8cc8a, #C9A84C);
      border-radius: 2px;
      margin-bottom: 1.75rem;
    }

    .footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-logo">
      <!-- Simple lotus/flower icon -->
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="18" cy="22" rx="4" ry="7"/>
        <ellipse cx="11" cy="19" rx="3.5" ry="6.5" transform="rotate(-30 11 19)"/>
        <ellipse cx="25" cy="19" rx="3.5" ry="6.5" transform="rotate(30 25 19)"/>
        <ellipse cx="7"  cy="15" rx="3" ry="5.5" transform="rotate(-55 7 15)"/>
        <ellipse cx="29" cy="15" rx="3" ry="5.5" transform="rotate(55 29 15)"/>
        <rect x="16.5" y="24" width="3" height="6" rx="1.5"/>
      </svg>
    </div>
    <h1>Nirvana Asia Group</h1>
    <p>Central Region · Stock Analysis</p>
  </div>

  <div class="card">
    <h2>Sign In</h2>
    <p class="subtitle">Enter your username and password to continue.</p>

    <div class="gold-rule"></div>

    <div class="info-box" id="expiredBox">
      Your session has expired. Please log in again.
    </div>

    <div class="error-box" id="errorBox">
      Invalid username or password. Please try again.
    </div>

    <form method="POST" action="/api/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" autofocus required autocapitalize="off" autocorrect="off" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required />
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <p class="footer">Confidential &middot; Internal Use Only</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('errorBox').classList.add('show');
    }
    if (params.get('expired')) {
      document.getElementById('expiredBox').classList.add('show');
    }
  </script>
</body>
</html>
